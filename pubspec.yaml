name: agendamento_app
description: Plataforma de agendamentos e gestão para barbearias.
publish_to: 'none'
version: 2.2.0+4004

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.0.0
  cloud_firestore: ^5.4.1
  cloud_functions: ^5.2.0
  firebase_auth: ^5.3.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.1
  flutter_image_compress: ^2.3.0
  flutter_local_notifications: ^17.2.2
  flutter_map: ^7.0.2
  geolocator: ^14.0.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  qr_flutter: ^4.1.0
  table_calendar: ^3.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo1.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/logo1.png
  remove_alpha_ios: true
